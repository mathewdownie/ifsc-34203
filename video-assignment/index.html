<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Gray Downie" />
    <meta name="description" content="Example of how video players are implemented in websites.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css" media="screen"/>
    <title>Video Player</title>
</head>
<body>
    <video poster="./assets/video/hudson-shelter-falls-poster.png" width="640" height="360" controls autoplay="autoplay">
        <source width="640" height="360" src="./assets/video/hudson-shelter-falls.mp4" type="video/mp4">
        <source width="640" height="360" src="./assets/video/hudson-shelter-falls.ogv" type="video/ogv">
        <source width="640" height="360" src="./assets/video/hudson-shelter-falls.webm" type="video/webm">
    </video>
</body>
</html>
